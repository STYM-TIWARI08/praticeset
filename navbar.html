<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .head {}

        .navbar {
            display: flex;
            align-items: center;
            gap: 36px;
            list-style: none;
            padding: 5px;
        }

        .navbar ul {
            padding-left: 857px;
            list-style: none;
            display: flex;
            flex-direction: row;
            gap: 20px;
            justify-content: space-between;
            align-content: center;

        }

        .navbar ul li a {
            text-decoration: none;
            color: red;
            justify-content: space-between;

        }
    </style>
</head>

<body>
    <header>
        <div class="head">
            <nav class="navbar">
                <h1 class="logo">LIMIT</h1>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About us</a></li>
                    <li><a href="#">Contact us</a></li>
                    <li><a href="#">Help</a></li>
                </ul>
            </nav>
        </div>

    </header>
</body>

</html>
